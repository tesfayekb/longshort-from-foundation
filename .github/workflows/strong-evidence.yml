name: strong-evidence

# Per FP-006 sub-step 6.4 (ACT-082) + FOLLOWUP-004 closure + ADR-003.
# Quality gates for strong-evidence tooling and the longshort verifier suite.
# Target wall-clock: <15 minutes per CROSSWIND §11.0.13 (advisory at 6.4;
# hard timeout layers in at sub-step 6.9).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  strong-evidence:
    runs-on: ubuntu-latest
    env:
      DENO_DIR: /home/runner/.cache/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.46.3

      - name: Cache Deno deps (DW-128 Stage 1)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Warm Deno cache (root + supabase/functions)
        run: |
          deno cache --lock=deno.lock \
            scripts/check-audit-writer-trap.ts \
            scripts/check-sentinel-patterns.ts \
            scripts/check-wall-clock.ts \
            scripts/check-paper-only-url.ts \
            scripts/check-unguarded-parsefloat.ts \
            scripts/check-catch-returns-zero.ts \
            scripts/check-edge-imports.ts \
            scripts/check-eligibility-bypass.ts \
            scripts/check-verify-after-mutation.ts \
            scripts/check-supabase-client-specifier.ts \
            scripts/check-handler-liveness-markers.ts \
            supabase/functions/_shared/longshort-verifiers/longshort-verifiers_test.ts
          (cd supabase/functions && deno cache --config=deno.json --lock=deno.lock $(find . -name '*_test.ts' -not -path './node_modules/*'))

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Gate 1 — audit-writer trap (DEC-034 clause (5))
        run: deno run --allow-read --lock=deno.lock scripts/check-audit-writer-trap.ts

      - name: Gate 2 — scripts/ Deno tests (19 tests)
        run: deno test --allow-read --allow-net --allow-env --lock=deno.lock scripts/

      - name: Gate 3 — longshort verifier suite (71 tests)
        run: deno test --allow-net --lock=deno.lock supabase/functions/_shared/longshort-verifiers/longshort-verifiers_test.ts

      - name: Gate 4 — Vitest + ESLint
        run: |
          npx vitest run
          npx eslint .

      - name: Gate 5 — Sentinel patterns ban (DEC-034 clause (2))
        run: deno run --allow-read --lock=deno.lock scripts/check-sentinel-patterns.ts

      - name: Gate 6 — Wall-clock leakage ban (DEC-034 clause (4))
        run: deno run --allow-read --lock=deno.lock scripts/check-wall-clock.ts

      - name: Gate 7 — Paper-only Alpaca URL ban (DEC-036 clause (2))
        run: deno run --allow-read --lock=deno.lock scripts/check-paper-only-url.ts

      - name: Gate 8 — Unguarded parseFloat (ACT-097 finding #13 / DW-058 B1)
        run: deno run --allow-read --lock=deno.lock scripts/check-unguarded-parsefloat.ts

      - name: Gate 9 — catch { return 0 } phantom-success ban (DEC-034 clause (2))
        run: deno run --allow-read --lock=deno.lock scripts/check-catch-returns-zero.ts

      - name: Gate 10 — Edge functions must not import from src/ (FP-011)
        run: deno run --allow-read --lock=deno.lock scripts/check-edge-imports.ts

      - name: Gate 11 — Edge function suite full execution (FP-008.4 #12 / Commit 1.5e)
        # Strengthened from `deno test --no-run` (type-check only) to full
        # `deno test` execution at FP-008.4 Commit 1.5e. Now catches both
        # the FP-008.3-shape type-contract-shape defect class AND runtime
        # behavioral failures (the 22 failures triaged across Commits
        # 1.5 / 1.5b / 1.5c / 1.5d would now block PRs at this gate).
        #
        # Scope: entire supabase/functions/ tree. Exclusions are declared
        # in supabase/functions/deno.json top-level `exclude` (NOT
        # test.exclude — the latter does not fully suppress collection).
        # Currently excluded: get-profile/index_test.ts (Cluster C — live
        # Supabase state required; integration-test-convention gap tracked
        # under INC-29 + deferred-work-register, re-included once the
        # convention lands).
        #
        # Green baseline at strengthening SHA: 237 passed / 0 failed
        # against the Gate-11-territory subset.
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --allow-read --lock=deno.lock

      - name: Gate 12 — Eligibility-caveat bypass ban (FP-008.4 Commit 2 / MIG-055)
        # Forbids direct .long_eligible / .short_eligible reads outside the
        # sanctioned allowlist (wrapper, producer, persister, verifier, engine,
        # replay fixtures, tests). New Phase 2+ downstream consumers (signals,
        # sizing, execution) MUST route reads through
        # _shared/longshort-universe/get-eligibility.ts, which gates on
        # assert_eligibility_complete(operator_id, as_of_date).
        #
        # Per ADR-003 enforcement-as-scripts-not-prose. Sibling shape to
        # Gate 5 / Gate 6 / Gate 9 banned-pattern checks. Placed AFTER Gate 11
        # per Commit 2 ordering decision.
        run: deno run --allow-read --lock=deno.lock scripts/check-eligibility-bypass.ts

      - name: Gate 13 — Verify-after-mutation ban (FP-008.4 Commit 7 / #8 forward-binding sentinel)
        # Forward-binding sentinel for the CROSSWIND §7.5 pre-mutation-gate invariant.
        # Flags any in-scope file in which a `.insert(/.update(/.upsert(/.delete()` call
        # appears BEFORE a verify_* wrapper invocation (or `reconcile(` call). Override
        # via `// gate-13-allow: post-mutation verify per §7.6 — <reason>` on the verify
        # line (or in the immediately-preceding comment block) — required for the
        # sanctioned post-fill verifies (verify_position / verify_lot_record per §7.6).
        #
        # File-level lexical heuristic (not control-flow): intentionally over-eager so
        # Phase-5 order-execution code cannot introduce a verify-after-mutation site
        # without explicit operator review. Current HEAD baseline: 0 violations.
        run: deno run --allow-read --lock=deno.lock scripts/check-verify-after-mutation.ts

      - name: Gate 14 — Supabase client specifier unification (FP-008.4 Commit 7.5 / DW-082 A1.b)
        # Prevents the dual-type-identity class that produced TS2322 between
        # esm.sh @supabase/supabase-js and the canonical npm/import-map specifier.
        # Both runtime imports and `import type { SupabaseClient } ...` declarations
        # under supabase/functions/ must use '@supabase/supabase-js'.
        run: deno run --allow-read --lock=deno.lock scripts/check-supabase-client-specifier.ts

      - name: Gate 15 — Handler liveness markers / cross-artifact sentinel (FP-008.4 Commit 10 / DW-084)
        # Cross-artifact sentinel for the INC-39 seam class. Joins job_registry's
        # final state (chronologically replayed from supabase/migrations/*.sql) to
        # the handler source on disk via the MIG-060 handler_path mapping. Flags:
        #   (P1) enabled=true + trigger_type='scheduled' + handler file marked
        #        NOT FOR LIVE INVOCATION or backed by MOCK_*_FETCHER, AND
        #   (P2) enabled=true + trigger_type='scheduled' + handler_path IS NULL
        #        (registry-completeness: enabled scheduled job dispatching to
        #        nothing). Override: `// gate-15-allow: <ID>` per docs/banned-patterns.md.
        # Pairs with the runtime two-invocation liveness rule (MIG-059 / Gate-11
        # liveness-check tests) as defense-in-depth across data + code dimensions.
        # Baseline at FP-008.4 Commit 10: CLEAN (the disarmed sweep's enabled=false
        # excludes it from the predicate).
        run: deno run --allow-read --lock=deno.lock scripts/check-handler-liveness-markers.ts