name: combiner-train

# Weekly LightGBM-LambdaRank combiner retrain (CROSSWIND §6.3 weekly-Sunday cadence).
# Runtime substitution per DEC-064 (Modal/Python training host -> GitHub Actions Python job;
# §6.1/6.2 LightGBM-LambdaRank algorithm lock HONORED, only the compute host substituted).
# Artifact storage per DEC-065 (Supabase Storage bucket combiner-models/).
#
# Required repository secrets (operator-provisioned):
#   SUPABASE_PROJECT_REF        - already provisioned (used by deploy-edge-functions)
#   SUPABASE_SERVICE_ROLE_KEY   - service_role secret; substrate read + Storage write
#
# The trainer writes status='candidate' rows only; promotion to 'active' is the
# criteria-gated promote_combiner_model RPC (3.3a), never this workflow.

on:
  schedule:
    # 06:00 UTC every Sunday (§6.3 weekly retrain cadence).
    - cron: '0 6 * * 0'
  workflow_dispatch:        # manual trigger for the first run / debugging

permissions:
  contents: read

concurrency:
  group: combiner-train
  cancel-in-progress: false   # never interrupt an in-flight training run

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - required secrets present
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::SUPABASE_PROJECT_REF GitHub secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY GitHub secret is not set"
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: training/combiner/requirements.txt

      - name: Install dependencies (hash-locked)
        working-directory: training/combiner
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Assert FEATURE_ORDER parity (TS <-> Python, DEC-064 Clause 4)
        working-directory: training/combiner
        run: python scripts/assert_feature_order_parity.py

      - name: Train combiner models
        working-directory: training/combiner
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python trainer.py
