# deploy-edge-functions — canonical Tier-A deploy workflow.
#
# RENAMED at ACT-209 from `deploy-insider-edge-functions.yml` per the
# §22.8.5 sub-class B closure (Registration-Dependency Deploy Gap):
# naming-by-current-scope drifts as new Tier-A functions land; naming
# by canonical-role (this IS the deploy pipeline for every function
# whose runtime contract requires BUILD_SHA threading OR depends on the
# shared signal-registry state) does not. Operator preference: this
# workflow is the canonical deploy path for all current and future
# Tier-A edge functions; the Lovable auto-deploy continues to cover
# the rest of the function surface unchanged.
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# Lovable's auto-deploy harness deploys edge functions on every push to
# `main`, but it has NO env-injection seam visible from the codebase: a
# Dashboard `BUILD_SHA` secret can hold a value, but the value cannot be
# updated per-deploy to the deploying commit SHA from inside the Lovable
# pipeline. F2-pre (ACT-201 / docs/ai-failure-modes.md §22.8.5) requires
# the deployed `x-build-sha` header to equal `git rev-parse HEAD` at the
# attested commit; with a static Dashboard secret, the header is either
# absent (`HEADER_MISSING`) or pins to a stale SHA (`MISMATCH`) — both
# auto-NEEDS-REVISION outcomes for any Tier-A money-path attestation.
#
# ACT-209 ADDS the four generic queue-worker functions (init, init-
# manual, slice, sweeper) to this workflow. Rationale: the runtime
# signal-registry state lives in each deployed worker's bundle, not in
# the source `production-registrations.ts`. A new signal registration
# (FP-050 F2.c `registerInsiderDailyConsumer()`) is INVISIBLE to a
# queue-worker isolate whose bundle pre-dates the registration call —
# the slice's `pickOldestRunningRun` filters by `registry.listSignalIds()`
# and silently noops on every cron tick, stranding the run forever
# under `status='running'` because the sweeper is symmetrically blind.
# This is §22.8.5 deploy-replay-lag sub-class B (Registration-Dependency
# Deploy Gap). The forward-binding rule (see ai-failure-modes.md §22.8.5
# sub-class B): any commit modifying `production-registrations.ts` or
# the registry-construction surface in `queue-config.ts` MUST redeploy
# ALL four registry-reading workers atomically with the source change.
# The `paths:` filter below enforces this — absence of those deploys
# in the same commit is a sub-class B violation by construction.
#
# This workflow REPLACES Lovable's auto-deploy for the seven functions
# listed below — all other edge functions continue to deploy via the
# Lovable harness. Adding a function here = explicit ACT entry, never
# silent.
#
# ACT-323 ADDS `longshort-rebalance-submit` — the FP-056 Phase-2
# placement trigger (ranks → §7 preflight → planRebalance →
# submitRebalance → POST /v2/orders). The money-path placement
# function belongs on the governed/reproducible deploy path, not the
# silent Lovable auto-deploy: the ACT-322 commit landed the function
# at HEAD `c58bccc8` but a Lovable auto-deploy did NOT pick it up
# (post-commit unauthenticated probe at HEAD `c0243e14` returned 404
# while the six functions on THIS workflow returned 401 — a textbook
# silent-auto-deploy-miss on the most money-path-critical function
# in the strategy surface). The silent miss is itself the argument
# for adopting the explicit pipeline.
#
# OPERATOR ACTION REQUIRED BEFORE FIRST FIRE
# ------------------------------------------
# Add the following GitHub Actions secrets to the repository
# (Settings → Secrets and variables → Actions):
#   - SUPABASE_ACCESS_TOKEN  — Personal access token from
#     https://supabase.com/dashboard/account/tokens (scope: project
#     admin). NOT the project's anon or service-role key.
#   - SUPABASE_PROJECT_REF   — `sftatlxatbdrotivxcip` (already the
#     visible ref in the Supabase URL). Stored as a secret rather than
#     hard-coded so a future project-ref change is single-touch.
#
# Until both secrets are present, this workflow exits non-zero at the
# "Verify required secrets" step and Lovable's auto-deploy continues
# unchanged (no regression — just no BUILD_SHA threading yet).
#
# FAILURE SEMANTICS
# -----------------
# - Missing secret → fail fast at "Verify required secrets" (exit 2).
# - `supabase secrets set` failure → fail; deploy steps are gated on it.
# - `supabase functions deploy` failure on any step → fail; partial
#   redeploys are tolerated because the secret-set has already run, so
#   any subsequent re-fire of the workflow will retry the failed deploys
#   with the same `$GITHUB_SHA` (idempotent in BUILD_SHA terms).
# - Success → operator runs `scripts/check-deployed-sha.ts` against
#   ALL SEVEN function URLs and pastes the seven MATCH outcomes into
#   the triggering ACT entry.

name: deploy-edge-functions

on:
  push:
    branches: [main]
    paths:
      # Insider compute import graph (original ACT-206 scope).
      - 'supabase/functions/longshort-insider-compute/**'
      - 'supabase/functions/longshort-insider-compute-manual/**'
      - 'supabase/functions/_shared/longshort-signals/insider-transactions/**'
      # Generic queue-worker functions (ACT-209 sub-class B scope).
      - 'supabase/functions/longshort-queue-init/**'
      - 'supabase/functions/longshort-queue-init-manual/**'
      - 'supabase/functions/longshort-queue-slice/**'
      - 'supabase/functions/longshort-queue-sweeper/**'
      # Placement trigger (ACT-323 / FP-056 Phase-2 money path).
      - 'supabase/functions/longshort-rebalance-submit/**'
      # Shared execution kernels the placement trigger links — a fix
      # to any of these must atomically redeploy the trigger isolate
      # (same sub-class B forward-binding rule as the queue workers).
      - 'supabase/functions/_shared/longshort-execution/**'
      - 'supabase/functions/_shared/longshort-broker-interfaces.ts'
      # Registry surface — any change here changes the in-bundle
      # registry state of every worker that reads it (init, init-manual,
      # slice, sweeper). Atomic redeploy is mandatory (sub-class B).
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/production-registrations.ts'
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/queue-config.ts'
      # Shared engine surface that every worker links (slice/finalizer/
      # sweeper). A bug-fix here that ships only via Lovable auto-deploy
      # would split-brain the engine across worker isolates.
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/queue-init.ts'
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/queue-slice-worker.ts'
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/queue-finalizer.ts'
      - 'supabase/functions/_shared/longshort-signals/shared/queue-worker/queue-sweeper.ts'
      # Shared handler — reads BUILD_SHA at module init; an edit can
      # change the header semantics even when no function-local file
      # changes.
      - 'supabase/functions/_shared/handler.ts'
      # The workflow file itself.
      - '.github/workflows/deploy-edge-functions.yml'
  # Operator-driven re-fire after secret rotation or recovery from a
  # transient Supabase API error. Inputs intentionally absent — the
  # deploying SHA is always `${{ github.sha }}` of the workflow run.
  workflow_dispatch:

concurrency:
  # Serialize deploys; never overlap two deploys onto the same function.
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GHA secret is not set — see workflow header for setup instructions"
            missing=1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::SUPABASE_PROJECT_REF GHA secret is not set — see workflow header for setup instructions"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 2
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Thread BUILD_SHA into runtime secrets (pre-deploy, ALL functions)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "Threading BUILD_SHA=${GITHUB_SHA} into project ${SUPABASE_PROJECT_REF}"
          # Single project-level secret — applies to every deployed
          # function. Must precede ALL deploy steps below (the deployed
          # isolate reads BUILD_SHA once at module init).
          supabase secrets set "BUILD_SHA=${GITHUB_SHA}" --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy longshort-queue-init
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-queue-init \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-queue-init-manual
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-queue-init-manual \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-queue-slice
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-queue-slice \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-queue-sweeper
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-queue-sweeper \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-insider-compute
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-insider-compute \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-insider-compute-manual
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-insider-compute-manual \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy longshort-rebalance-submit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy longshort-rebalance-submit \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Summary
        run: |
          echo "Deployed seven edge functions with BUILD_SHA=${GITHUB_SHA}."
          echo "Operator next: run scripts/check-deployed-sha.ts against ALL SEVEN URLs:"
          for fn in longshort-queue-init longshort-queue-init-manual longshort-queue-slice longshort-queue-sweeper longshort-insider-compute longshort-insider-compute-manual longshort-rebalance-submit; do
            echo "  https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/$fn"
          done
          echo "Contract: all seven must report MATCH deployed=${GITHUB_SHA} source=${GITHUB_SHA} (exit 0)."