# FP-069 OVERSHOOT Wave-1a: Separation-Contract CI guard.
# Runs the tree-scan check on every PR that touches the overshoot or longshort
# surfaces, and executes the unit tests for the guard itself.
name: overshoot-guards

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/overshoot/**'
      - 'supabase/functions/overshoot-*/**'
      - 'supabase/functions/_shared/longshort-**'
      - 'supabase/functions/longshort-**'
      - 'scripts/check-overshoot-separation*'
      - '.github/workflows/overshoot-guards.yml'
  push:
    branches: [main]

jobs:
  separation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          # FP-069 W2 (ACT-457): pin corrected — v1.46.3 cannot parse lockfile v5
          # (Deno 2.x lockfile format); v2.9.1 is supervisor-verified against the
          # separation guard + fetcher tests.
          deno-version: v2.9.1
      - name: Run overshoot separation guard
        run: deno run --allow-read scripts/check-overshoot-separation.ts
      - name: Test the guard itself
        run: deno test --allow-read scripts/check-overshoot-separation_test.ts
      - name: Test overshoot fetchers
        run: deno test --allow-read --allow-net supabase/functions/_shared/overshoot/
      - name: "INC-90 gate — no NULL:: placeholders in overshoot money-path handlers"
        run: |
          # INC-90 standing invariant (ACT-485) — NULL::<type> placeholders
          # in overshoot execution handlers are FORBIDDEN as a silent-
          # sentinel-adjacent pattern. Placeholders MUST be replaced with
          # real sources (JOINs) or typed refusals (never NaN, never a
          # silent default). See docs/06-tracking/incidental-findings.md
          # INC-90 and docs/06-tracking/action-tracker.md ACT-485 for
          # full context.
          if grep -RIn --include='*.ts' -E 'NULL::[a-zA-Z]' \
               supabase/functions/overshoot-detection-run \
               supabase/functions/overshoot-entry-run \
               supabase/functions/overshoot-exit-run \
               supabase/functions/overshoot-short-interest-compute 2>/dev/null; then
            echo "::error::INC-90 violation: NULL:: placeholder found in an overshoot money-path handler. Replace with a real source (JOIN) or a typed refusal. See INC-90."
            exit 1
          fi
          echo "INC-90 gate clean: no NULL:: placeholders in overshoot money-path handlers."
      - name: "INC-91 gate — no numeric-literal snapshot-age bounds outside single-home"
        run: |
          # INC-91 standing invariant (ACT-486) — snapshot-age comparisons
          # in _shared/overshoot-execution/ MUST import
          # OVERSHOOT_SNAPSHOT_MIN_AGE_MS / MAX_AGE_MS from
          # snapshot-age-bounds.ts. Numeric-literal bounds at any sibling
          # site are a class-drift risk (the exact pathology that made
          # ACT-485 half-fix INC-90 while leaving entry-/exit-price on
          # the old [0, 15000] bound). See docs/06-tracking/incidental-
          # findings.md INC-91 and docs/06-tracking/action-tracker.md
          # ACT-486 for full context.
          HITS=$(grep -RIn --include='*.ts' -E 'snapshotAgeMs\s*[<>]=?\s*-?[0-9][0-9_]*' \
                   supabase/functions/_shared/overshoot-execution 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::INC-91 violation: numeric-literal snapshot-age bound found. Import from snapshot-age-bounds.ts instead."
            echo "$HITS"
            exit 1
          fi
          echo "INC-91 gate clean: all snapshot-age bounds routed through the single home."